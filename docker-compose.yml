services:

  postgres:
    image: postgres:16
    container_name: enterprise_ai_postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: enterprise_ai
      POSTGRES_USER: enterprise_user
      POSTGRES_PASSWORD: enterprise_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: